{% extends "base.html" %} {% load static %} {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/add_question.css' %}" />
{% endblock %} {% block content %}
<div class="add-question-page">
  <div class="card add-question-card">
    <div class="card-header add-question-header border-0 py-4 px-4">
      <div class="add-question-kicker">QUESTION BANK</div>
      <h2 class="add-question-title mt-2">Add Question</h2>
      {% if quiz.title %}
      <div class="mt-3">
        <span class="quiz-title-badge">{{ quiz.title }}</span>
      </div>
      {% endif %}
    </div>

    <div class="card-body px-4 pb-4">
      <form method="POST" class="add-question-form">
        {% csrf_token %}

        <div class="form-grid">
          <div class="full-width mb-2">
            <label class="form-label" for="question">Question</label>
            <input
              type="text"
              class="form-control"
              id="question"
              name="question"
              rerquired
            />
          </div>

          <div class="mb-2">
            <label class="form-label" for="option1">Option 1</label>
            <input
              type="text"
              class="form-control"
              id="option1"
              name="option1"
              rerquired
            />
          </div>

          <div class="mb-2">
            <label class="form-label" for="option2">Option 2</label>
            <input
              type="text"
              class="form-control"
              id="option2"
              name="option2"
              rerquired
            />
          </div>

          <div class="mb-2">
            <label class="form-label" for="option3">Option 3</label>
            <input
              type="text"
              class="form-control"
              id="option3"
              name="option3"
              rerquired
            />
          </div>

          <div class="mb-2">
            <label class="form-label" for="option4">Option 4</label>
            <input
              type="text"
              class="form-control"
              id="option4"
              name="option4"
              rerquired
            />
          </div>

          <div class="full-width mb-2">
            <label class="form-label" for="correct_answer"
              >Correct Answer</label
            >
            <select
              class="form-select"
              id="correct_answer"
              name="correct_answer"
            >
              <option value="A">option1</option>
              <option value="B">option2</option>
              <option value="C">option3</option>
              <option value="D">option4</option>
            </select>
          </div>
        </div>

        <div
          class="d-flex justify-content-between align-items-center gap-3 action-row"
        >
          <a
            href="{% url 'teacher_dashboard' %}"
            class="btn btn-outline-primary back-to-dashboard-btn"
          >
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
          </a>
          <button type="submit" class="btn btn-primary primary-btn">
            Save Question
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
