{% extends "base.html" %} {% load static %} {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/edit_quiz.css' %}" />
{% endblock %} {% block content %}
<div class="edit-quiz-page">
  <div class="card edit-quiz-card">
    <div class="card-header text-center">
      <h1>Edit Quiz</h1>
    </div>

    <div class="card-body">
      <form method="POST" class="edit-quiz-form">
        {% csrf_token %}

        <div class="mb-3">
          <label>Title</label>
          <input type="text" name="title" value="{{ quiz.title }}" />
        </div>

        <div class="mb-3">
          <label>Subject</label>
          <select name="subject">
            {% for subject in subjects %}
            <option
              value="{{ subject.id }}"
              {%
              if
              subject.id=""
              ="quiz.subject.id"
              %}
              selected
              {%
              endif
              %}
            >
              {{ subject.name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div
          class="d-flex justify-content-between align-items-center gap-3 flex-wrap action-row"
        >
          <a
            href="{% url 'teacher_dashboard' %}"
            class="btn btn-outline-primary back-to-dashboard-btn"
          >
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
          </a>
          <button type="submit" class="btn btn-primary update-quiz-btn">
            Update Quiz
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
