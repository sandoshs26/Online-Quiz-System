{% extends "base.html" %} 

{% load static %} 

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/edit_question.css' %}" />
{% endblock %} 

{% block content %}
<div class="edit-question-page">
  <div class="card edit-question-card">
    <div class="card-header text-center">
      <h2>Edit Question</h2>
    </div>

    <div class="card-body">
      <form method="POST" class="edit-question-form">
        {% csrf_token %}

        <div class="mb-3">
          <label>Question</label>
          <input
            type="text"
            name="question"
            value="{{ question.question }}"
            required
          />
        </div>

        <div class="mb-3">
          <label>Option 1</label>
          <input
            type="text"
            name="option1"
            value="{{ question.option1 }}"
            required
          />
        </div>

        <div class="mb-3">
          <label>Option 2</label>
          <input
            type="text"
            name="option2"
            value="{{ question.option2 }}"
            required
          />
        </div>

        <div class="mb-3">
          <label>Option 3</label>
          <input
            type="text"
            name="option3"
            value="{{ question.option3 }}"
            required
          />
        </div>

        <div class="mb-3">
          <label>Option 4</label>
          <input
            type="text"
            name="option4"
            value="{{ question.option4 }}"
            required
          />
        </div>

        <div class="mb-3">
          <label>Correct Answer</label>
          <input
            type="text"
            name="correct_answer"
            value="{{ question.correct_answer }}"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Update Question</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
