{% extends "base.html" %} 

{% load static %} 

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/quiz_list.css' %}" />
{% endblock %} 

{% block content %}
<div class="quiz-list-page">
  <div class="quiz-list-header">
    <div class="quiz-list-kicker">QUIZ CENTER</div>
    <h2>Available Quizzes</h2>
  </div>

  <div class="row g-4">
    {% for quiz in quizzes %}
    <div class="col-lg-6">
      <div class="card quiz-card h-100">
        <div class="card-body d-flex flex-column">
          <div class="quiz-card-badge mb-3">Quiz</div>
          <div class="quiz-card-title">
            <a href="{% url 'quiz_detail' quiz.id %}">{{ quiz.title }}</a>
          </div>
          <p class="quiz-card-description mb-4">{{ quiz.description }}</p>

          <div class="mt-auto">
            <a
              href="{% url 'quiz_detail' quiz.id %}"
              class="btn btn-primary w-100"
              >View Quiz</a
            >
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="mt-4">
    <a href="{% url 'student_dashboard' %}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
