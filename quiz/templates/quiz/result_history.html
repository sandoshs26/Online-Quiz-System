{% extends "base.html" %} 

{% load static %} 

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/result_history.css' %}" />
{% endblock %} 

{% block content %}
<div class="result-history-page">
  <div class="card result-history-card">
    <div class="result-history-header">
      <h2>My Quiz Results</h2>
    </div>

    <div class="result-history-body">
      <div class="table-responsive">
        <table class="table table-hover result-history-table mb-0">
          <thead>
            <tr>
              <th>Quiz</th>
              <th>Score</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            {% for result in results %}
            <tr>
              <td>{{ result.quiz.title }}</td>
              <td>{{ result.score }}</td>
              <td>{{ result.total }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <a href="{% url 'student_dashboard' %}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
